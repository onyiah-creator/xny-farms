# Cloudflare Pages configuration for XNY Farms Limited.
#
# This is a STATIC site — plain HTML/CSS/JS with NO build step.
# You do not strictly need this file to deploy: in the Cloudflare dashboard
# just set Framework preset = None, Build command = (empty), and
# Build output directory = / (the repo root).
#
# It is provided so you can also deploy from the CLI:
#   npx wrangler pages deploy . --project-name=xny-farms

name = "xny-farms"
pages_build_output_dir = "."
compatibility_date = "2025-01-01"

# KV namespace backing the referral / affiliate programme (see README
# section 6). The Pages Functions in functions/api/ read and write it via
# env.REFERRALS_KV, so the binding name below must stay exactly that.
[[kv_namespaces]]
binding = "REFERRALS_KV"
id = "9cfbe8d5b6d44927828e0f2ddf6bec6b"
