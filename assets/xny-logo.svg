    <path d="M42 40 L100 92" stroke="#7CB342" stroke-width="10"/>
    <path d="M165 40 Q205 5 235 40" stroke="#12492C" stroke-width="16" fill="none"/>
    <path d="M100 92 L20 165 Q10 185 30 195 Q48 202 62 185 L165 40" stroke="#12492C" stroke-width="16"/>
    <path d="M118 108 L45 200 Q38 214 52 220 Q64 225 74 212 L150 118" stroke="#12492C" stroke-width="16"/>
  </g>
  <path d="M150 60 Q185 40 200 70 Q170 75 150 60 Z" fill="#8DC63F"/>
  <path d="M150 60 Q160 90 150 120 Q135 90 150 60 Z" fill="#4C9A2A"/>

