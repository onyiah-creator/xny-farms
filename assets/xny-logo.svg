  <text x="255" y="150" font-family="'Baloo 2','Arial Rounded MT Bold',sans-serif" font-weight="800" font-size="88" fill="#D3DC30" stroke="#12492C" stroke-width="4" paint-order="stroke" letter-spacing="1">XNY</text>
